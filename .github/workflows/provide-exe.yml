name: provide exe

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: install sbcl
      run: |
        winget install -e --id SBCL.SBCL --accept-source-agreements --accept-package-agreements
        $sbclPath = Split-Path (Get-Command sbcl.exe).Source
        echo "$sbclPath" >> $env:GITHUB_PATH
        sbcl --version

    - name: install quicklisp
      run: |
        curl.exe -O http://beta.quicklisp.org/quicklisp.lisp
        sbcl '--load' 'quicklisp.lisp' '--eval' "(quicklisp-quickstart:install)"
                                       '--eval' "(ql:add-to-init-file)"
                                       '--quit'
    - name: install packages
      run: echo "install packages"
    - name: make .exe
      run: echo "make .exe"
    - name: release
      run: echo "make release"