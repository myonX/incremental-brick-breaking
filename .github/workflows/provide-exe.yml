name: provide exe

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: install sbcl
      run: |
        winget install -e --id SBCL.SBCL --accept-source-agreements --accept-package-agreements
        sbcl --version
    - name: install packages
      run: echo "install packages"
    - name: make .exe
      run: echo "make .exe"
    - name: release
      run: echo "make release"