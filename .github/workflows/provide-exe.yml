name: build and test

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Disable Git automatic line ending conversion
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout repository2
        uses: actions/checkout@v4
        with:
          path: 'i-b-b'

      - name: Install Roswell
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install roswell
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"
          ros setup

      - name: Install Trial and Dependencies
        shell: pwsh
        run: |
          ros run -e '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)'
          ros run -e '(ql-dist:install-dist "http://dist.shirakumo.org/shirakumo.txt" :prompt nil)'
          ros install glfw
          ros install pngload
          ros dynamic-space-size=4gb install trial
          ros install chroma

      - name: Checkout alloy
        uses: actions/checkout@v4
        with:
          repository: 'Shirakumo/alloy'
          path: 'alloy'

      - name: Checkout 3b-bmfont
        uses: actions/checkout@v4
        with:
          repository: '3b/3b-bmfont'
          path: '3b-bmfont'

      - name: Checkout sdf (msdf branch)
        uses: actions/checkout@v4
        with:
          repository: '3b/sdf'
          ref: 'msdf'
          path: 'sdf'

      - name: Move repos to Roswell local-projects
        shell: pwsh
        run: |
          $localProjects = "$env:USERPROFILE\.roswell\local-projects"
          New-Item -ItemType Directory -Force -Path $localProjects | Out-Null
          ls
          Move-Item -path "i-b-b" -Destination "$localProjects\incremental-brick-breaking"
          Move-Item -Path "alloy" -Destination "$localProjects\alloy" -Force
          Move-Item -Path "3b-bmfont" -Destination "$localProjects\3b-bmfont" -Force
          Move-Item -Path "sdf" -Destination "$localProjects\sdf" -Force

      - name: Copy msdf cache from repository
        shell: pwsh
        run: |
          $cacheDir = "$env:USERPROFILE\.cache\alloy\msdf"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          
          # リポジトリ内の cache/msdf/ の中身を Roswell のキャッシュディレクトリにコピー
          Copy-Item -Path "cache\msdf-cache\*" -Destination $cacheDir -Recurse -Force

      - name: Make .exe
        shell: pwsh
        run: |
          ros dynamic-space-size=4gb build-game.lisp
          ls

      - name: Release
        shell: pwsh
        run: echo "make release"